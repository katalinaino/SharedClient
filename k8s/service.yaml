# Service público — es el único objeto que HAProxy conoce
# (demo-api.default.svc.cluster.local:3000). El pipeline SOLO
# manipula el selector "slot" de este Service para cortar tráfico
# entre blue y green; nunca cambia su nombre ni su puerto.
# NodePort 30090 se mantiene para pruebas manuales/EA2.
apiVersion: v1
kind: Service
metadata:
  name: demo-api
  labels:
    app: demo-api
spec:
  type: NodePort
  selector:
    app: demo-api
    slot: blue   # bootstrap: arranca en blue. El pipeline actualiza esto en cada promoción.
  ports:
    - name: http
      port: 3000
      targetPort: http
      nodePort: 30090
