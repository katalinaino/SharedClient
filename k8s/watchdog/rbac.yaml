apiVersion: v1
kind: ServiceAccount
metadata:
  name: demo-api-watchdog
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: demo-api-watchdog-role
  namespace: default
rules:
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale"]
    verbs: ["get", "list", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: demo-api-watchdog-binding
  namespace: default
subjects:
  - kind: ServiceAccount
    name: demo-api-watchdog
    namespace: default
roleRef:
  kind: Role
  name: demo-api-watchdog-role
  apiGroup: rbac.authorization.k8s.io
