# Bootstrap del slot GREEN. Arranca como standby cálido (1 réplica)
# con la misma imagen que blue. El pipeline lo actualizará con la
# imagen nueva la primera vez que "green" sea el slot candidato.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-api-green
  labels:
    app: demo-api
    slot: green
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-api
      slot: green
  template:
    metadata:
      labels:
        app: demo-api
        slot: green
    spec:
      containers:
        - name: api
          image: kata63/demo-api:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: demo-api-preview-green
spec:
  type: ClusterIP
  selector:
    app: demo-api
    slot: green
  ports:
    - name: http
      port: 3000
      targetPort: http
